async function activateSlot(slot, button) {
  const liveStatus = lastStatus?.liveStatus;
  const force = liveStatus === "unmanaged" || liveStatus === "unknown";
  if (force) {
    const reason = liveStatus === "unmanaged"
      ? L("현재 Claude 로그인은 등록 슬롯 밖이라 백업할 수 없습니다.",
          "The current Claude login is outside the registered slots and cannot be backed up.")
      : L("현재 Claude 계정 식별자를 확인할 수 없습니다.",
          "The current Claude account identity cannot be verified.");
    const ok = await showConfirm({
      title: L("강제 전환", "Force switch"),
      body: `${reason}\n${L("선택한 슬롯으로 강제 전환할까요?", "Force-switch to the selected slot?")}`,
      confirmLabel: L("강제 전환", "Force switch"),
      danger: true,
    });
    if (!ok) return;
  }
  if (button) button.disabled = true;
  const post = (forceFlag, overCapOk) => fetch(`/api/slot/${slot}/activate`, {
    method: "POST",
    headers: { "X-LimitPilot": "1", "Content-Type": "application/json" },
    body: JSON.stringify({ force: forceFlag, overCapOk }),
  });
  try {
    let r = await post(force, false);
    let d = await r.json().catch(() => ({}));
    if (r.status === 409 && d.code === "over_cap") {
      // 서버가 주간 최대치 초과를 알림 — 확인하면 force 로 다시 요청, 취소면 아무것도 안 함
      const ok = await showConfirm({
        title: L("주간 최대치 초과", "Over weekly max"),
        body: d.error,
        confirmLabel: L("그래도 전환", "Switch anyway"),
        danger: true,
      });
      if (!ok) {
        if (button) button.disabled = false;
        return;
      }
      r = await post(force, true);
      d = await r.json().catch(() => ({}));
    }
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    toast(d.message || L(`슬롯 ${slot} 활성화 완료`, `Slot ${slot} activated`));
  } catch (e) {
    toast(L(`전환 실패: ${e.message}`, `Switch failed: ${e.message}`));
  }
  refresh();
}

async function removeSlot(slot) {
  const s = regSlots().find((x) => x.slot === slot);
  const label = s ? (s.label || s.email || L(`슬롯 ${slot}`, `Slot ${slot}`))
                  : L(`슬롯 ${slot}`, `Slot ${slot}`);
  const ok = await showConfirm({
    title: L("계정 삭제", "Delete account"),
    body: L(`${label} 계정을 삭제할까요?\n키체인 백업도 함께 제거됩니다.`,
            `Delete ${label}?\nIts keychain backup is removed too.`),
    confirmLabel: L("삭제", "Delete"),
    danger: true,
  });
  if (!ok) return;
  mutate(slot, "delete");
}

// ── 계정 추가 플로우 (격리된 공식 OAuth — 서버 워커가 등록) ──
let addActive = false;
let addUrl = null;
let addCodeDraft = "";
let addMessage = "";
let addSessionId = null;
let addGeneration = 0;

async function gatewayAdd() {
  gatewayDraft.alias = ($("gwAlias")?.value || "").trim();
  gatewayDraft.baseUrl = ($("gwBase")?.value || "").trim();
  gatewayDraft.modelId = ($("gwModel")?.value || "").trim();
  gatewayDraft.authMode = $("gwAuth")?.value || "bearer";
  gatewayDraft.token = $("gwToken")?.value || "";
  gatewayDraft.inputTokenLimit = $("gwInputLimit")?.value || "0";
  gatewayDraft.outputTokenLimit = $("gwOutputLimit")?.value || "0";
  gatewayDraft.inputPricePerMillion = $("gwInputPrice")?.value || "0";
  gatewayDraft.outputPricePerMillion = $("gwOutputPrice")?.value || "0";
  gatewayDraft.costLimit = $("gwCostLimit")?.value || "0";
  if (!gatewayDraft.baseUrl || !gatewayDraft.modelId || (!gatewayDraft.token && gatewayEditSlot === null)) {
    toast(L("게이트웨이 URL, 모델 ID, 토큰을 모두 입력하세요", "Enter the gateway URL, model ID, and token"));
    return;
  }
  const editingSlot = gatewayEditSlot;
  const btn = $("gwAddBtn");
  if (btn) { btn.disabled = true; btn.textContent = L("연결 테스트 중…", "Testing connection…"); }
  try {
    const r = await fetch(editingSlot === null ? "/api/gateway/add" : `/api/gateway/${editingSlot}/update`, {
      method: "POST",
      headers: { "X-LimitPilot": "1", "Content-Type": "application/json" },
      body: JSON.stringify(gatewayDraft),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    gatewayDraft = { alias: "", baseUrl: "", modelId: "", token: "", authMode: "bearer",
      inputTokenLimit: "0", outputTokenLimit: "0", inputPricePerMillion: "0",
      outputPricePerMillion: "0", costLimit: "0" };
    gatewayEditSlot = null;
    addOpen = false;
    toast(d.message || (editingSlot === null ? L("게이트웨이 등록 완료", "Gateway registered") : L("게이트웨이 수정 완료", "Gateway updated")));
    refresh();
  } catch (e) {
    toast(editingSlot === null
      ? L(`등록 실패: ${e.message}`, `Registration failed: ${e.message}`)
      : L(`수정 실패: ${e.message}`, `Update failed: ${e.message}`));
    if (btn) { btn.disabled = false; btn.textContent = editingSlot === null ? L("연결 테스트 후 저장", "Test connection and save") : L("연결 테스트 후 수정", "Test connection and update"); }
  }
}

async function addCancel() {
  const sessionId = addSessionId;
  addGeneration += 1;
  addActive = false;
  addUrl = null;
  addCodeDraft = "";
  addMessage = L("브라우저 로그인 대기 중", "Waiting for browser login");
  addSessionId = null;
  addOpen = false;
  try {
    if (sessionId) await fetch("/api/add/cancel", {
      method: "POST",
      headers: { "X-LimitPilot": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
  } catch (e) { /* 화면은 즉시 닫고 다음 시작이 이전 세션을 정리한다 */ }
  refresh();
}

async function addStart() {
  const generation = ++addGeneration;
  const el = $("addAlias");
  const alias = el ? el.value.trim() : "";
  const btn = $("addBtn");
  if (btn) { btn.disabled = true; btn.textContent = L("브라우저 여는 중…", "Opening browser…"); }
  try {
    const r = await fetch("/api/add/start", {
      method: "POST",
      headers: { "X-LimitPilot": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ alias }),
    });
    const d = await r.json().catch(() => ({}));
    if (generation !== addGeneration) return;
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    if (!d.sessionId) throw new Error(L("로그인 세션 ID를 받지 못했습니다", "No login session ID received"));
    addActive = true;
    addUrl = d.url || null;
    addCodeDraft = "";
    addMessage = d.message || L("브라우저 로그인 대기 중", "Waiting for browser login");
    addSessionId = d.sessionId;
    renderBoard();
    pollAdd(generation, d.sessionId);
  } catch (e) {
    if (generation !== addGeneration) return;
    toast(L(`실패: ${e.message}`, `Failed: ${e.message}`));
    if (btn) { btn.disabled = false; btn.textContent = L("브라우저로 로그인해 추가", "Add via browser login"); }
  }
}

async function addFeed() {
  const generation = addGeneration;
  const sessionId = addSessionId;
  const el = $("addCode");
  const code = el ? el.value.trim() : "";
  if (!code) { toast(L("코드를 붙여넣으세요", "Paste the code first")); return; }
  addCodeDraft = code;
  try {
    const r = await fetch("/api/add/code", {
      method: "POST",
      headers: { "X-LimitPilot": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ code, sessionId }),
    });
    const d = await r.json().catch(() => ({}));
    if (generation !== addGeneration || sessionId !== addSessionId) return;
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    addMessage = L("인증 코드 처리 중", "Processing auth code");
    renderBoard();
    toast(L("코드 전달됨 — 등록 대기 중", "Code delivered — waiting for registration"));
  } catch (e) {
    if (generation === addGeneration && sessionId === addSessionId) {
      toast(L(`실패: ${e.message}`, `Failed: ${e.message}`));
    }
  }
}

function pollAdd(generation, sessionId) {
  const tick = async () => {
    if (!addActive || generation !== addGeneration || sessionId !== addSessionId) return;
    try {
      const r = await fetch("/api/add/status", { cache: "no-store" });
      const d = await r.json();
      if (!addActive || generation !== addGeneration || sessionId !== addSessionId) return;
      if (d.sessionId && d.sessionId !== sessionId) {
        addActive = false;
        addUrl = null; addCodeDraft = ""; addSessionId = null; addOpen = false;
        toast(L("다른 창에서 새 계정 로그인이 시작되었습니다", "A new account login started in another window"));
        refresh(); return;
      }
      if (d.message && d.status === "running" && d.message !== addMessage) {
        addMessage = d.message;
        renderBoard();
      }
      if (d.status === "done") {
        addActive = false;
        addUrl = null; addCodeDraft = ""; addSessionId = null; addOpen = false;
        toast(d.message || L("계정 추가됨", "Account added")); refresh(); return;
      }
      if (d.status === "error") {
        addActive = false;
        addUrl = null; addCodeDraft = ""; addSessionId = null;
        toast(L(`추가 실패: ${d.message || "알 수 없음"}`, `Add failed: ${d.message || "unknown"}`)); refresh(); return;
      }
      if (d.status === "idle") {
        addActive = false;
        addUrl = null; addCodeDraft = ""; addSessionId = null; addOpen = false;
        refresh(); return;
      }
    } catch (e) { /* 일시 오류 무시 */ }
    setTimeout(tick, 2000);
  };
  tick();
}

// ── 갱신 루프 ───────────────────────────────────────────
async function refresh() {
  // 숨겨진 탭은 폴링하지 않는다 — 다시 보이면 visibilitychange 가 곧바로 갱신한다
  if (document.hidden) return;
  try {
    // no-cache: 서버의 ETag 로 재검증 — 바뀐 것이 없으면 304(본문 없음)
    const r = await fetch("/api/status", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    $("banner").style.display = "none";
  } catch (e) {
    $("banner").textContent = L("서버에 연결할 수 없습니다 — 대시보드 프로세스가 실행 중인지 확인하세요.",
                                "Cannot reach the server — check that the dashboard process is running.");
    $("banner").style.display = "block";
  }
}

function tickCountdowns() {
  document.querySelectorAll("[data-reset]").forEach((el) => {
    const iso = el.getAttribute("data-reset");
    if (iso) el.textContent = countdown(iso);
  });
}

// ── 테마 전환: 시스템 → 라이트 → 다크 순환, localStorage 유지 ──
const THEME_ICONS = {
  auto: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg>`,
  light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>`,
  dark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>`,
};
const THEME_LABELS = () => (LANG === "en"
  ? { auto: "System", light: "Light", dark: "Dark" }
  : { auto: "시스템", light: "라이트", dark: "다크" });

function themeMode() {
  const t = localStorage.getItem("limitpilot-theme");
  return t === "light" || t === "dark" ? t : "auto";
}

function applyTheme(mode) {
  if (mode === "auto") {
    delete document.documentElement.dataset.theme;
    localStorage.removeItem("limitpilot-theme");
  } else {
    document.documentElement.dataset.theme = mode;
    localStorage.setItem("limitpilot-theme", mode);
  }
  const btn = $("themeBtn");
  btn.innerHTML = THEME_ICONS[mode];
  btn.title = L(`테마: ${THEME_LABELS()[mode]} (클릭해 전환)`, `Theme: ${THEME_LABELS()[mode]} (click to cycle)`);
  btn.setAttribute("aria-label", L("테마 전환", "Switch theme"));
}

function cycleTheme() {
  const order = ["auto", "light", "dark"];
  const next = order[(order.indexOf(themeMode()) + 1) % order.length];
  applyTheme(next);
  toast(L(`테마: ${THEME_LABELS()[next]}`, `Theme: ${THEME_LABELS()[next]}`));
}

// 창 프레즌스 — 연결이 살아 있는 동안 서버가 '창 열림'을 알고 중복 창을 막는다
// EventSource 는 헤더를 붙일 수 없어 토큰을 쿼리로 보낸다(이 경로만 허용)
const presence = new EventSource(
  `/api/presence?build=${encodeURIComponent(PAGE_BUILD)}&token=${encodeURIComponent(API_TOKEN)}`);
// 서버가 바뀌면 EventSource가 스스로 재연결한다 — 그 즉시 상태를 읽어 빌드 변경을 감지.
// 백그라운드 창은 타이머가 느려지므로 폴링만 믿으면 새로고침이 늦어 창이 중복으로 열린다
presence.onopen = () => refresh();

applyTheme(themeMode());
// 연습 모드 표시 — 가짜 계정·가상 사용량이라는 것을 화면에서 숨기지 않는다
if (IS_DEMO) {
  $("demoBadge").hidden = false;
  $("demoBadge").title = L("연습용 목(mock) 모드: 가짜 계정 3개, 실제 자격증명·네트워크를 쓰지 않음",
                           "Practice (mock) mode: three fake accounts, no real credentials or network");
}
// 위젯의 "브라우저로 계정 추가…" 는 #add 로 연다 — 추가 패널을 펼친 채 시작
if (location.hash === "#add") { addOpen = true; }
// 첫 응답 전에도 기억된 언어로 정적 문구를 맞춘다
document.documentElement.lang = LANG;
$("thrLbl").textContent = L("세션 임계", "Session threshold");
$("wthrLbl").textContent = L("주간 임계", "Weekly threshold");
$("updated").innerHTML = `<span class="pulse"></span>${L("연결 중…", "Connecting…")}`;
// 정적 마크업은 영어 기본값 — 한국어 설정이면 첫 페인트에서 라벨·aria-label·title 도 한국어로 맞춘다
$("thr").setAttribute("aria-label", L("세션 임계(전역)", "Session threshold (global)"));
$("wthr").setAttribute("aria-label", L("주간 임계(전역)", "Weekly threshold (global)"));
$("wthrFollow").textContent = L("세션과 같게", "Match session");
$("autoLbl").textContent = L("자동 전환", "Auto-switch");
$("kaLbl").textContent = L("유지 호출", "Keep-alive");
$("prioLbl").textContent = L("리셋 임박 우선", "Expiring first");
$("burnLbl").textContent = L("리셋 전 소진", "Use-up before reset");
$("refreshAllBtn").title = L("전체 사용량 새로고침", "Refresh all usage");
$("refreshAllBtn").setAttribute("aria-label", $("refreshAllBtn").title);
syncSliderFill();
refresh();
scheduleRefresh();
setInterval(tickCountdowns, 10_000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});
</script>
</body>
