[project]
name = "limitpilot"
version = "0.1.2"  # src/limitpilot/__init__.py 의 __version__ 과 같아야 한다(tests/test_packaging.py 가 확인)
description = "See Claude Code usage per account in your menu bar / tray and switch accounts before a limit hits (opt-in). Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeeGyeongPil" }]
keywords = ["claude-code", "menu-bar", "tray", "usage", "accounts", "keychain", "launchd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/limitpilot"
Issues = "https://github.com/LeeGyeongPil/limitpilot/issues"

[project.scripts]
limitpilot = "limitpilot.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
